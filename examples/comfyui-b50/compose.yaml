# Build the pinned Intel image first; this file never downloads model weights.
services:
  comfyui-b50:
    image: "${COMFY_IMAGE:-llm-scaler-omni:0.2.0-b2-comfyui-bmg}"
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:?Set VIDEO_GID from your GPU device ownership}"
      - "${RENDER_GID:?Set RENDER_GID from your B50 render device ownership}"
    ports:
      - "${COMFY_BIND:-127.0.0.1}:${COMFY_PORT:-8188}:8188"
    shm_size: 16g
    environment:
      DEVICE: xpu
      FORCE_XPU: "1"
      IPEX_XPU_ARCH: battlemage
      ZE_AFFINITY_MASK: "${ZE_AFFINITY_MASK:-0}"
      ONEAPI_DEVICE_SELECTOR: level_zero:gpu
      OMNI_COMFYUI_RESERVE_VRAM_GB: "3"
      PYTORCH_XPU_ALLOC_CONF: roundup_power2_divisions:16
      SYCL_CACHE_PERSISTENT: "1"
      ZES_ENABLE_SYSMAN: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - "${COMFY_DATA:?Set COMFY_DATA}/models:/models/host:ro"
      - "${COMFY_DATA}/input:/data/input"
      - "${COMFY_DATA}/output:/data/output"
      - "${COMFY_DATA}/user:/data/user"
    command: ["/llm/entrypoints/start_comfyui.sh"]
